[project]
name = "autoresearch-lab"
version = "0.7.0"
description = "Data-agnostic hypothesis evaluation lab"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
# Run from repo root after `pip install -e .` with PYTHONPATH set, or invoke directly:
#   python .agents/skills/autoresearch/scripts/autoresearch.py
autoresearch = "autoresearch:main"

[tool.setuptools]
py-modules = ["autoresearch"]

[tool.setuptools.packages.find]
where = [".agents/skills/autoresearch/scripts"]
include = ["autoresearch_runtime*"]

[tool.setuptools.package-dir]
"" = ".agents/skills/autoresearch/scripts"

[build-system]
requires = ["setuptools>=77.0.1"]
build-backend = "setuptools.build_meta"
