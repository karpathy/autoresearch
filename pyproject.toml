[project]
name = "researchfs-core"
version = "0.2.0"
description = "Lightweight, local SQLite-backed memory for research artifacts and agents"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pypdf>=6.4.0",
    "requests>=2.32.0",
]

[project.optional-dependencies]
llm = [
    "openai>=1.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["researchfs"]

[tool.hatch.build.targets.sdist]
include = [
    "/README.md",
    "/pyproject.toml",
    "/researchfs",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
