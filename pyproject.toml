[project]
name = "researchfs-core"
version = "0.2.0"
description = "Lightweight, local SQLite-backed memory for research artifacts and agents"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    { name = "ResearchFS contributors" },
]
keywords = ["research", "agents", "sqlite", "memory", "provenance"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Database",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "pypdf>=6.4.0",
    "requests>=2.32.0",
]

[project.urls]
Homepage = "https://github.com/mattmccarthy11/researchfs"
Documentation = "https://github.com/mattmccarthy11/researchfs#readme"
Repository = "https://github.com/mattmccarthy11/researchfs.git"
Issues = "https://github.com/mattmccarthy11/researchfs/issues"
Changelog = "https://github.com/mattmccarthy11/researchfs/blob/main/CHANGELOG.md"
Security = "https://github.com/mattmccarthy11/researchfs/security/policy"

[project.scripts]
researchfs-migrate = "researchfs.migrations:main"

[project.optional-dependencies]
llm = [
    "openai>=1.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["researchfs"]

[tool.hatch.build.targets.sdist]
include = [
    "/CHANGELOG.md",
    "/LICENSE",
    "/README.md",
    "/pyproject.toml",
    "/researchfs",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
