name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Build and publish GitHub release
    if: github.repository == 'mattmccarthy11/researchfs'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v8
        with:
          python-version: "3.11"
          enable-cache: true
      - name: Verify tag matches package version
        run: |
          package_version="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          test "${GITHUB_REF_NAME}" = "v${package_version}"
      - name: Test locked core environment
        run: |
          uv sync --locked --group dev
          uv run pytest -q
      - name: Build and inspect distributions
        run: |
          uv build
          uv run python scripts/verify_distribution.py dist
      - name: Publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" dist/* --verify-tag --generate-notes --title "ResearchFS ${GITHUB_REF_NAME}"
